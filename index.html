const pages = [];

chapters.forEach((chapter, chapterIndex) => {
  const paragraphs = chapter.text.trim().split(/\n\s*\n/);
  let currentPage = "";
  let firstPage = true;

  function savePage() {
    if (!currentPage.trim()) return;
    pages.push({
      chapter: chapterIndex,
      chapterTitle: chapter.title,
      title: firstPage ? chapter.title : "",
      text: currentPage.trim()
    });
    firstPage = false;
    currentPage = "";
  }

  paragraphs.forEach(paragraph => {
    const sentences = paragraph.trim().split(/(?<=[.!?])\s+/);

    sentences.forEach(sentence => {
      if (currentPage.length + sentence.length > 750 && currentPage) {
        savePage();
      }

      currentPage += (currentPage ? " " : "") + sentence;
    });

    currentPage += "\n\n";
  });

  savePage();
});

let currentPageIndex = 0;

function renderPage() {
  const page = pages[currentPageIndex];
  const chapter = chapters[page.chapter];

  document.getElementById("chapterLabel").textContent =
    "Capítulo " + (page.chapter + 1);

  document.getElementById("pageTitle").textContent =
    page.title || chapter.title;

  const pageText = document.getElementById("pageText");
  pageText.replaceChildren();

  page.text.split(/\n\s*\n/).forEach(paragraph => {
    if (!paragraph.trim()) return;

    const p = document.createElement("p");
    p.textContent = paragraph.trim();

    if (paragraph.trim().startsWith("“")) {
      p.className = "opening";
    }

    pageText.appendChild(p);
  });

  document.getElementById("pageCounter").textContent =
    "Página " + (currentPageIndex + 1) + " de " + pages.length;

  document.getElementById("prevBtn").disabled =
    currentPageIndex === 0;

  document.getElementById("nextBtn").disabled =
    currentPageIndex === pages.length - 1;

  document.getElementById("progress").style.width =
    ((currentPageIndex + 1) / pages.length * 100) + "%";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function changePage(direction) {
  const nextIndex = currentPageIndex + direction;

  if (nextIndex < 0 || nextIndex >= pages.length) return;

  currentPageIndex = nextIndex;
  renderPage();
}

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") changePage(1);
  if (event.key === "ArrowLeft") changePage(-1);
});

renderPage();
</script>
